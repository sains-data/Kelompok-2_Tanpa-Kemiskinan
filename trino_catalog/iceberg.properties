connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://iceberg-postgres:5432/iceberg_catalog
iceberg.jdbc-catalog.connection-user=admin
iceberg.jdbc-catalog.connection-password=password
iceberg.jdbc-catalog.catalog-name=trino_cat
iceberg.jdbc-catalog.default-warehouse-dir=s3a://warehouse/

# Menghidupkan Modul Native S3
fs.native-s3.enabled=true

# Konfigurasi Native S3 (Tanpa Hive)
s3.endpoint=http://iceberg-minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=admin
s3.aws-secret-key=password